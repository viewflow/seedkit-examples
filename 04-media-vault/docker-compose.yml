name: 04-media-vault

services:
  db:
    image: postgres:17
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"   # host Django reaches it via localhost; 5432 taken by a host-level Homebrew postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6380:6379"   # host Django / workers reach it via localhost; 6379 taken by a host-level Homebrew redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    volumes: ["miniodata:/data"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:9000:9000"   # S3 API — loopback only; production uses real S3
      - "127.0.0.1:9001:9001"   # web console
    command: server /data --console-address ":9001"
    healthcheck:
      # `wget` isn't in minio/minio:latest — use curl, which is.
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  miniodata:

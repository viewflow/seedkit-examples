[project]
name = "04-media-vault"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "daphne>=4.2.2",
    "django>=6.0,<7.0",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-modern-rest[msgspec,openapi]>=0.11.0",
    "django-redis>=7.0.0",
    "django-rq>=4.1.1",
    "django-storages[s3]>=1.14.6",
    "django-structlog>=10.1.0",
    "django-tasks-rq>=0.12.0",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "pyjwt>=2.13.0",
    "structlog>=26.1.0",
    "uvicorn-worker>=0.4.0",
    "uvicorn[standard]>=0.50.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.6",
    "pyright>=1.1.411",
    "ruff>=0.15.20",
]

[tool.ruff]
# target-version auto-detected from `requires-python`
line-length = 100
extend-exclude = ["migrations", "*/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "DJ",       # flake8-django
    "S",        # flake8-bandit
    "SIM",      # flake8-simplify
    "RUF",
]
ignore = [
    "E501",     # line length — formatter handles it
    "S101",     # assert — fine in tests
    "RUF012",   # mutable class attrs — Django idiom (Meta.fields, REQUIRED_FIELDS, list_display, fieldsets, …)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**"      = ["S"]
"**/test_*.py"     = ["S"]
"**/tests.py"      = ["S"]                   # Django's default `startapp` stub
"**/settings/*.py" = ["F405", "F403", "S105", "S106"]  # star imports + dev-only SECRET_KEY / password defaults

[tool.ruff.lint.isort]
known-first-party = ["config", "jobs", "api"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["."]
exclude = [
    "**/migrations/**",
    "**/__pycache__",
    ".venv",
    "staticfiles",
    "media",
    # django-environ's conditional default pattern (`default="x" if DEBUG else env.NOTSET`)
    # produces false-positive reportArgumentType errors — pyright sees `str | NoValue`
    # where `NoValue` is expected. Excluding settings avoids dozens of spurious errors.
    "config/settings",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"               # match `requires-python`
typeCheckingMode = "basic"           # "standard" once code is typed; "strict" is noisy on Django
useLibraryCodeForTypes = true        # read source for packages without stubs (allauth, axes, …)
reportMissingTypeStubs = "none"      # third-party stubs are optional
strictListInference = true

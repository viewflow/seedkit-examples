{% extends "base.html" %}

{% block title %}Posts - 01 Minimal Blog{% endblock %}

{% block content %}
    <ul>
        {% for post in posts %}
            <li><a href="{{ post.get_absolute_url }}">{{ post.title }}</a></li>
        {% empty %}
            <li>No posts yet.</li>
        {% endfor %}
    </ul>
{% endblock %}

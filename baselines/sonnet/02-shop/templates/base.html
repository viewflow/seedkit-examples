{% load static tailwind_cli %}<!DOCTYPE html>
<html lang="en" data-theme="corporate">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shop{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}A small shop built with Django.{% endblock %}">

    <meta property="og:title" content="{% block og_title %}Shop{% endblock %}">
    <meta property="og:description" content="{% block og_description %}A small shop built with Django.{% endblock %}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">

    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    {% tailwind_css %}
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-base-100 text-base-content">
    <header class="navbar bg-base-200 px-4">
        <div class="flex-1">
            <a href="{% url 'pages:index' %}" class="btn btn-ghost text-xl">Shop</a>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    {% if debug %}
        {% load django_browser_reload %}
        {% django_browser_reload_script %}
    {% endif %}
</body>
</html>

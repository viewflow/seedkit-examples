[project]
name = "shop"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "django-allauth>=65.18.0",
    "django-axes>=8.3.1",
    "django-browser-reload>=1.21.0",
    "django-environ>=0.14.0",
    "django-tailwind-cli>=4.4.2",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "stripe>=15.3.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.7",
    "django-stubs-ext>=6.0.7",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py"]
addopts = "--reuse-db"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["config", "users", "pages", "billing"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["config", "users", "pages", "billing", "manage.py", "conftest.py"]
useLibraryCodeForTypes = true

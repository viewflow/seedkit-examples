[project]
name = "media-vault"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "django>=6.0.7",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-modern-rest[jwt,msgspec,openapi]>=0.11.0",
    "django-storages[s3]>=1.14.6",
    "django-tasks-rq>=0.12.0",
    "psycopg[binary]>=3.3.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.7",
    "pyright>=1.1.411",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["config", "api", "jobs"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["config", "api", "jobs"]
exclude = ["**/migrations", ".venv"]
reportMissingImports = true
reportMissingTypeStubs = false

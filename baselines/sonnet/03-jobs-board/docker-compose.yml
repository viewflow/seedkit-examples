services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jobs_board
      POSTGRES_USER: jobs_board
      POSTGRES_PASSWORD: jobs_board
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs_board"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:

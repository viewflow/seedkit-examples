{% load i18n %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="utf-8">
    <title>{% translate "Log in" %}</title>
</head>
<body>
    <h1>{% translate "Log in" %}</h1>
    <p>{% translate "Enter your email address and we'll send you a login link." %}</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">{% translate "Send login link" %}</button>
    </form>
</body>
</html>

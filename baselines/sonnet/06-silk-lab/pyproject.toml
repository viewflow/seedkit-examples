[project]
name = "silk-lab"
version = "0.1.0"
description = "Profile a few request paths with django-silk and run a simple background email task on the DB backend."
requires-python = ">=3.12"
dependencies = [
  "django>=6.0,<6.1",
  "psycopg[binary]>=3.2",
  "django-environ>=0.14",
  "django-silk>=5.5",
  "django-tasks>=0.12",
  "django-tasks-db>=0.12",
  "django-extensions>=4.1",
  "django-zeal>=2.2",
  "django-migration-linter>=6.0",
]

[dependency-groups]
dev = [
  "ruff>=0.16",
  "pytest>=8.4",
  "pytest-django>=4.12",
  "django-test-migrations>=1.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

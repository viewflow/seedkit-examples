services:
  app:
    build:
      context: .
      target: prod
    restart: unless-stopped
    env_file: .env
    environment:
      DB_DIR: /app/db
    volumes:
      - db-data:/app/db
      - media-data:/app/media
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media-data:/srv/media:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  media-data:
  caddy-data:
  caddy-config:

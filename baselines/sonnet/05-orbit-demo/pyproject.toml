[project]
name = "orbit-demo"
version = "0.1.0"
description = "Scratch project to exercise django-orbit and verify outbound mail flows are captured."
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.7",
    "django-orbit[mcp]>=0.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

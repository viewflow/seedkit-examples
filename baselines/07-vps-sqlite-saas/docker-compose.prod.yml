services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_DB_PATH: /app/data/db.sqlite3
      DJANGO_CACHE_DB_PATH: /app/data/cache.sqlite3
      DJANGO_MEDIA_ROOT: /app/media
    volumes:
      - data:/app/data
      - media:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz/')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_DB_PATH: /app/data/db.sqlite3
      DJANGO_CACHE_DB_PATH: /app/data/cache.sqlite3
      DJANGO_MEDIA_ROOT: /app/media
    volumes:
      - data:/app/data
      - media:/app/media
    entrypoint: ["python", "manage.py"]
    command: ["db_worker"]
    depends_on:
      app:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  data:
  media:
  caddy_data:
  caddy_config:

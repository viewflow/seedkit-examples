[tools]
python = "3.12"

[tasks.setup]
description = "Install dependencies and pre-commit hooks"
run = "uv sync && uv run pre-commit install"

[tasks.dev]
description = "Run the local dev server"
run = "uv run manage.py runserver"

[tasks.migrate]
description = "Apply database migrations and ensure the cache table exists"
run = "uv run manage.py migrate && uv run manage.py createcachetable --database=cache"

[tasks.makemigrations]
description = "Generate new migrations"
run = "uv run manage.py makemigrations"

[tasks.worker]
description = "Run the django-tasks database worker"
run = "uv run manage.py db_worker"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks.lint]
description = "Run ruff lint + format checks"
run = "uv run ruff check . && uv run ruff format --check ."

[tasks.format]
description = "Auto-format code with ruff"
run = "uv run ruff format . && uv run ruff check --fix ."

[tasks.typecheck]
description = "Run pyright"
run = "uv run pyright"

[tasks.check]
description = "Run lint, typecheck and tests"
depends = ["lint", "typecheck", "test"]

app = "fly-app"
primary_region = "iad"

[build]

[processes]
  web = "gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
  worker = "celery -A config worker --loglevel info"
  bolt = "python manage.py runbolt --host 0.0.0.0 --port 8001"

[env]
  DJANGO_SETTINGS_MODULE = "config.settings.production"
  PORT = "8000"

[[services]]
  processes = ["web"]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/healthz/"
    protocol = "http"

[[services]]
  processes = ["bolt"]
  internal_port = 8001
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8001
    handlers = ["http"]

[[vm]]
  processes = ["web"]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[vm]]
  processes = ["worker"]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[vm]]
  processes = ["bolt"]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

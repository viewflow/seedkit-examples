[project]
name = "fly-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.6.3",
    "django>=5.1,<5.2",
    "django-anymail[postmark]>=15.0",
    "django-axes>=8.3.1",
    "django-bolt>=0.9.0",
    "django-csp>=4.0",
    "django-environ>=0.14.0",
    "django-mail-auth>=3.5.5",
    "django-storages[s3]>=1.14.6",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.2",
    "redis>=6.4.0",
    "sentry-sdk>=2.64.0",
    "uvicorn[standard]>=0.50.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.0.6",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "api"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["tests.py", "test_*.py"]
addopts = "--reuse-db"

[tool.django-stubs]
django_settings_module = "config.settings.local"

[tool.pyright]
include = ["config", "core", "api", "manage.py"]
exclude = ["**/migrations", ".venv"]
venvPath = "."
venv = ".venv"

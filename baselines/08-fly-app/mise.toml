[tools]
python = "3.12"

[env]
DJANGO_SETTINGS_MODULE = "config.settings.local"
_.file = ".env"

[tasks.setup]
description = "Install dependencies"
run = "uv sync"

[tasks.up]
description = "Start Postgres/Redis/MinIO for local dev"
run = "docker compose up -d"

[tasks.down]
description = "Stop local dev services"
run = "docker compose down"

[tasks.migrate]
description = "Apply database migrations"
run = "uv run manage.py migrate"

[tasks.dev]
description = "Run the Django dev server"
run = "uv run manage.py runserver"
depends = ["up", "migrate"]

[tasks.worker]
description = "Run the Celery worker"
run = "uv run celery -A config worker --loglevel info"

[tasks.bolt]
description = "Run the django-bolt API server"
env = { DJANGO_SETTINGS_MODULE = "config.settings.bolt" }
run = "uv run manage.py runbolt"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks.lint]
description = "Lint with Ruff"
run = "uv run ruff check ."

[tasks.format]
description = "Format with Ruff"
run = "uv run ruff format ."

[tasks.typecheck]
description = "Type check with pyright"
run = "uv run pyright"

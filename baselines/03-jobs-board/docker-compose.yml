services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: jobsboard
      POSTGRES_PASSWORD: jobsboard
      POSTGRES_DB: jobsboard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  db_data:
  redis_data:

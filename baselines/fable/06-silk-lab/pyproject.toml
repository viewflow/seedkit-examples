[project]
name = "silk-lab"
version = "0.1.0"
description = "Profile request paths with django-silk and run background email tasks on the Django Tasks database backend."
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "django-silk>=5.3",
    "django-tasks>=0.7",
    "django-extensions>=4.1",
    "django-migration-linter>=5.2",
    "django-tasks-db>=0.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "pytest>=8.3",
    "pytest-django>=4.11",
    "django-test-migrations>=1.4",
    "django-zeal>=2.0",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.django_migration_linter]
include_apps = ["jobs"]

[project]
name = "vps-sqlite-saas"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.0.7",
    "django-allauth[mfa]>=65.18.0",
    "django-axes>=8.3.1",
    "django-csp>=4.0",
    "django-environ>=0.14.0",
    "django-structlog>=10.1.0",
    "django-tasks-db>=0.12.0",
    "gunicorn>=26.0.0",
    "sentry-sdk>=2.66.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.7",
    "pre-commit>=4.6.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "DJ",  # flake8-django
    "S",   # flake8-bandit
]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F405"]
"tests/*" = ["S105", "S106"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
exclude = [".venv", "**/migrations", "**/node_modules"]
reportAttributeAccessIssue = "warning"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = "--ds=config.settings.test"

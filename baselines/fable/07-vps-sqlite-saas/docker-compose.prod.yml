services:
  web:
    build:
      context: .
      target: prod
    restart: unless-stopped
    env_file: .env
    volumes:
      - data:/app/data
      - media:/app/media
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: .
      target: prod
    restart: unless-stopped
    command: ["python", "manage.py", "db_worker"]
    env_file: .env
    volumes:
      - data:/app/data
      - media:/app/media
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  data:
  media:
  caddy_data:
  caddy_config:

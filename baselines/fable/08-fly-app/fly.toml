app = "08-fly-app"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "python manage.py migrate --noinput"

[env]
  DJANGO_SETTINGS_MODULE = "config.settings.production"

[processes]
  web = "gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
  worker = "celery -A config worker -l info"
  bolt = "sh -c 'DJANGO_SETTINGS_MODULE=config.settings.bolt python manage.py runbolt --host 0.0.0.0 --port 8001'"

[http_service]
  processes = ["web"]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/readyz"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[services]]
  processes = ["bolt"]
  internal_port = 8001
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

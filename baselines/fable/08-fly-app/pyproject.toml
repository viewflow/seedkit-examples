[project]
name = "08-fly-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.6.3",
    "django>=6.0.7",
    "django-anymail[postmark]>=15.0",
    "django-axes>=8.3.1",
    "django-bolt>=0.9.1",
    "django-csp>=4.0",
    "django-environ>=0.14.0",
    "django-mail-auth>=3.5.5",
    "django-storages[s3]>=1.14.6",
    "gunicorn>=26.0.0",
    "msgspec>=0.21.1",
    "psycopg[binary]>=3.3.4",
    "redis>=6.4.0",
    "sentry-sdk[django]>=2.66.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.7",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
exclude = ["**/__pycache__", ".venv", "staticfiles"]

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jobs_board
      POSTGRES_USER: jobs_board
      POSTGRES_PASSWORD: jobs_board
    ports:
      # 5433 on the host: 5432 is commonly taken by a local Postgres install
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs_board"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

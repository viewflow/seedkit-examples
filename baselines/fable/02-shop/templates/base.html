{% load static tailwind_cli %}<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Shop{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}A small shop with fast checkout and friendly service.{% endblock %}">
    <meta property="og:title" content="{% block og_title %}Shop{% endblock %}">
    <meta property="og:description" content="{% block og_description %}A small shop with fast checkout and friendly service.{% endblock %}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.build_absolute_uri }}">
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    {% tailwind_css %}
  </head>
  <body class="min-h-screen bg-base-100 text-base-content">
    <main class="mx-auto max-w-3xl px-4 py-16">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>

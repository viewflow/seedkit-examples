[tools]
python = "3.12"

[tasks.setup]
description = "Install dependencies, create the database, run migrations"
run = [
    "uv sync",
    "createdb shop_db || true",
    "uv run manage.py migrate",
]

[tasks.dev]
description = "Run the dev server with the Tailwind watcher"
run = "uv run manage.py tailwind runserver"

[tasks.css]
description = "Build the Tailwind CSS bundle once"
run = "uv run manage.py tailwind build"

[tasks.migrate]
description = "Apply database migrations"
run = "uv run manage.py migrate"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks.lint]
description = "Lint with Ruff"
run = "uv run ruff check ."

[tasks.typecheck]
description = "Type-check with pyright"
run = "uv run pyright"

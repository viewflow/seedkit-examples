[project]
name = "media-vault"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "django>=6.0.7",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-modern-rest[jwt,msgspec,openapi]>=0.11.0",
    "django-storages[s3]>=1.14.6",
    "django-structlog>=10.1.0",
    "django-tasks-rq>=0.12.0",
    "psycopg[binary]>=3.3.4",
    "redis>=8.0.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.7",
    "pyright>=1.1.411",
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "DJ",  # flake8-django
]

[tool.pyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
exclude = [".venv", "**/migrations", "**/__pycache__"]

{% extends "base.html" %}

{% block title %}{{ post.title }} — Minimal Blog{% endblock %}

{% block content %}
  <article>
    <h2>{{ post.title }}</h2>
    <time datetime="{{ post.published_at|date:'c' }}">{{ post.published_at|date:"j F Y" }}</time>
    <p>by {{ post.author.get_username }}</p>
    {{ post.body|linebreaks }}
  </article>
  <p><a href="{% url 'blog:post_list' %}">&larr; All posts</a></p>
{% endblock %}

# Local backing services only. Django, the RQ worker and uvicorn run on the
# host so you keep reload and a debugger.
#
#   docker compose up -d
#   uv run uvicorn config.asgi:application --reload --host 0.0.0.0
#   uv run manage.py rqworker default
#
# Published host ports default to the standard ones. If the host already runs
# its own Postgres/Redis, override POSTGRES_PORT / REDIS_PORT in .env (and
# match them in DATABASE_URL / REDIS_URL) instead of stopping those services.

name: media-vault

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: media_vault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d media_vault"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"          # S3 API
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"  # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the bucket the app expects, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/media
        echo "bucket 'media' ready"
    restart: "no"

volumes:
  pgdata:
  redisdata:
  miniodata:

[project]
name = "04-media-vault"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "django>=5.2,<6",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-modern-rest[jwt,msgspec,openapi]>=0.11.0",
    "django-storages[s3]>=1.14.6",
    "django-tasks-rq>=0.12.0",
    "psycopg[binary]>=3.3.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "daphne>=4.2.3",
    "django-stubs>=6.0.7",
    "pyright>=1.1.411",
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "C4",     # comprehensions
    "DJ",     # flake8-django
    "SIM",    # simplify
    "RUF",    # ruff-specific
]
ignore = [
    "RUF012",  # Django class attrs are mutable ClassVars by convention
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["api", "config", "jobs"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = ["api", "config", "jobs", "manage.py"]
exclude = ["**/migrations", "**/__pycache__", ".venv"]
reportMissingTypeStubs = false

[tool.django-stubs]
django_settings_module = "config.settings.local"

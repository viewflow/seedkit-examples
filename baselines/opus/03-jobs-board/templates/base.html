{% load i18n %}<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% translate "Jobs board" %}{% endblock %}</title>
</head>
<body>
  <header>
    <a href="{% url 'jobs:list' %}">{% translate "Jobs board" %}</a>
    {% if user.is_authenticated %}
      <form action="{% url 'mailauth:logout' %}" method="post">
        {% csrf_token %}
        <button type="submit">{% translate "Log out" %}</button>
      </form>
    {% else %}
      <a href="{% url 'mailauth:login' %}">{% translate "Log in" %}</a>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>

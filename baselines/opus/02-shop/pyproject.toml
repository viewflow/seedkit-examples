[project]
name = "shop"
version = "0.1.0"
description = "02-shop — a small e-commerce site"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<6.0",
    "psycopg[binary]>=3.2",
    "django-environ>=0.12",
    "whitenoise>=6.9",
    "django-allauth>=65.4",
    "django-axes>=7.0",
    "django-tailwind-cli>=4.2",
    "stripe>=11.0",
    "gunicorn>=23.0",
]

[dependency-groups]
dev = [
    "django-browser-reload>=1.18",
    "ruff>=0.9",
    "pyright>=1.1.393",
    "django-stubs[compatible-mypy]>=5.1",
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "DJ",   # flake8-django
    "UP",   # pyupgrade
    "RUF",
]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["config", "pages", "shop", "users"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py", "tests.py"]
addopts = "--reuse-db"
testpaths = ["tests"]

[tool.pyright]
include = ["config", "pages", "shop", "users", "tests", "manage.py"]
exclude = ["**/migrations", "**/__pycache__", ".venv", "node_modules"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "error"

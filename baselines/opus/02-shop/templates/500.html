{% load static tailwind_cli %}<!DOCTYPE html>
{# Standalone by design: a 500 page must not depend on context processors. #}
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    {% tailwind_css %}
  </head>
  <body class="min-h-screen bg-base-100 text-base-content">
    <section class="hero min-h-screen">
      <div class="hero-content text-center">
        <div class="max-w-md">
          <p class="font-mono text-6xl font-bold opacity-30">500</p>
          <h1 class="mt-4 text-3xl font-bold">Something went wrong</h1>
          <p class="py-4 opacity-70">The error has been logged. Please try again in a moment.</p>
          <a href="/"><button class="btn btn-primary">Back to the shop</button></a>
        </div>
      </div>
    </section>
  </body>
</html>

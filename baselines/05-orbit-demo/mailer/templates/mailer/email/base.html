<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block subject %}{{ subject }}{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5; font-family:Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden;">
          <tr>
            <td style="background-color:#111827; padding:20px 32px;">
              <span style="color:#ffffff; font-size:18px; font-weight:bold;">{{ site_name|default:"05 Orbit Demo" }}</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px; color:#1f2937; font-size:15px; line-height:1.5;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px; background-color:#f9fafb; color:#9ca3af; font-size:12px;">
              {% block footer %}Sent from {{ site_name|default:"05 Orbit Demo" }}.{% endblock %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

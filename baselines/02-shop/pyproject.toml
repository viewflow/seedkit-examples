[project]
name = "shop"
version = "0.1.0"
description = "Small e-commerce site with admin and SMTP transactional email."
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "psycopg[binary]>=3.2",
    "django-environ>=0.11",
    "whitenoise>=6.7",
    "gunicorn>=23.0",
    "django-allauth>=65.0",
    "django-axes>=7.0",
    "django-tailwind-cli>=2.21",
    "stripe>=11.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.7",
    "pyright>=1.1",
    "django-stubs[compatible-mypy]>=5.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "DJ", "B"]
ignore = ["DJ001"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["tests.py", "test_*.py"]

[tool.pyright]
include = ["."]
exclude = ["**/migrations", ".venv"]
venvPath = "."
venv = ".venv"

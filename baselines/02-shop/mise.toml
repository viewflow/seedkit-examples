[tools]
python = "3.12"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.install]
description = "Install/sync dependencies"
run = "uv sync"

[tasks.run]
description = "Run the local dev server"
run = "uv run python manage.py runserver"

[tasks.migrate]
description = "Apply database migrations"
run = "uv run python manage.py migrate"

[tasks.makemigrations]
description = "Generate new database migrations"
run = "uv run python manage.py makemigrations"

[tasks.tailwind-build]
description = "Build the production Tailwind CSS bundle"
run = "uv run python manage.py tailwind build"

[tasks.tailwind-watch]
description = "Watch and rebuild Tailwind CSS on change"
run = "uv run python manage.py tailwind watch"

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

[tasks.lint]
description = "Lint with ruff"
run = "uv run ruff check ."

[tasks.format]
description = "Format with ruff"
run = "uv run ruff format ."

[tasks.typecheck]
description = "Type-check with pyright"
run = "uv run pyright"

[tasks.check]
description = "Run lint, typecheck and tests"
depends = ["lint", "typecheck", "test"]

{% load static tailwind_cli %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Shop{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}A small shop built with Django.{% endblock %}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{% block og_title %}Shop{% endblock %}">
  <meta property="og:description" content="{% block og_description %}A small shop built with Django.{% endblock %}">
  <meta property="og:url" content="{{ request.build_absolute_uri }}">
  <meta name="twitter:card" content="summary">

  <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
  {% tailwind_css %}
  {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-base-100 text-base-content">
  <header class="navbar bg-base-100 shadow-sm px-4">
    <div class="flex-1">
      <a href="{% url 'pages:index' %}" class="btn btn-ghost text-xl">Shop</a>
    </div>
  </header>

  <main class="container mx-auto px-4 py-8">
    {% if messages %}
      <div class="mb-6 space-y-2">
        {% for message in messages %}
          <div class="alert">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>

[project]
name = "media-vault"
version = "0.1.0"
description = "Media-heavy app: S3 uploads, Redis-queued background processing, WebSocket status updates."
requires-python = ">=3.12"
dependencies = [
    "channels>=4.3.2",
    "channels-redis>=4.3.0",
    "django>=6.0.6",
    "django-cors-headers>=4.9.0",
    "django-environ>=0.14.0",
    "django-modern-rest[jwt,msgspec,openapi]>=0.11.0",
    "django-storages[s3]>=1.14.6",
    "django-structlog>=10.1.0",
    "django-tasks-rq>=0.12.0",
    "psycopg[binary]>=3.3.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.50.2",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.6",
    "pyright>=1.1.411",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4"]
ignore = ["DJ001"]

[tool.ruff.lint.isort]
known-first-party = ["config", "core", "api", "jobs"]

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["api", "config", "core", "jobs", "manage.py"]
exclude = ["**/migrations"]

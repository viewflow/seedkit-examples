services:
  web:
    image: ${IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - static_data:/app/staticfiles
      - backup_data:/app/backups

  worker:
    image: ${IMAGE}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    entrypoint: []
    command: ["python", "manage.py", "rqworker", "--job-class", "django_tasks_rq.Job", "default"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backup_data:/app/backups

  backup:
    image: ${IMAGE}:${IMAGE_TAG:-latest}
    profiles: ["tools"]
    env_file: .env
    entrypoint: []
    command: ["python", "manage.py", "dbbackup", "--noinput"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backup_data:/app/backups

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  redis_data:
  static_data:
  backup_data:

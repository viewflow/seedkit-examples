[project]
name = "09-ssh-deploy"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.6",
    "django-csp>=4.0",
    "django-dbbackup>=5.3.0",
    "django-environ>=0.14.0",
    "django-rq>=4.1.1",
    "django-structlog>=10.1.0",
    "django-tasks>=0.12.0",
    "django-tasks-rq>=0.12.0",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "sentry-sdk>=2.64.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["tests.py", "test_*.py"]

[tools]
python = "3.12"

[env]
DJANGO_SETTINGS_MODULE = "config.settings.local"

[tasks.up]
description = "Start local db/redis dependencies"
run = "docker compose up -d"

[tasks.down]
description = "Stop local db/redis dependencies"
run = "docker compose down"

[tasks.migrate]
description = "Apply database migrations"
run = "uv run manage.py migrate"

[tasks.dev]
description = "Run the development server"
run = "uv run manage.py runserver"

[tasks.worker]
description = "Run the RQ worker"
run = "uv run manage.py rqworker --job-class django_tasks_rq.Job default"

[tasks.lint]
description = "Lint with ruff"
run = "uv run ruff check ."

[tasks.test]
description = "Run the test suite"
run = "uv run pytest"

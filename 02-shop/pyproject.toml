[project]
name = "02-shop"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0,<7.0",
    "django-allauth>=65.18.0",
    "django-axes>=8.3.1",
    "django-dbbackup>=5.3.0",
    "django-environ>=0.14.0",
    "django-tailwind-cli>=4.6.2",
    "gunicorn>=26.0.0",
    "psycopg[binary]>=3.3.4",
    "stripe>=15.3.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.6",
    "django-stubs-ext>=6.0.6",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations", "*/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "DJ",       # flake8-django
    "S",        # flake8-bandit
    "SIM",      # flake8-simplify
    "RUF",
]
ignore = [
    "E501",     # line length — formatter handles it
    "S101",     # assert — fine in tests
    "RUF012",   # mutable class attrs — Django idiom (Meta.fields, REQUIRED_FIELDS, list_display, fieldsets, …)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**"      = ["S"]
"**/test_*.py"     = ["S"]
"**/tests.py"      = ["S"]                   # Django's default `startapp` stub
"**/settings/*.py" = ["F405", "F403", "S105", "S106"]  # star imports + dev-only SECRET_KEY / password defaults

[tool.ruff.lint.isort]
known-first-party = ["config", "users", "pages", "billing"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.pyright]
include = ["."]
exclude = [
    "**/migrations/**",
    "**/__pycache__",
    ".venv",
    "staticfiles",
    "media",
    # django-environ's conditional default pattern (`default="x" if DEBUG else env.NOTSET`)
    # produces false-positive reportArgumentType errors — pyright sees `str | NoValue`
    # where `NoValue` is expected. Excluding settings avoids dozens of spurious errors.
    "config/settings",
]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"               # match `requires-python`
typeCheckingMode = "basic"           # "standard" once code is typed; "strict" is noisy on Django
useLibraryCodeForTypes = true        # read source for packages without stubs (allauth, axes, …)
reportMissingTypeStubs = "none"      # third-party stubs are optional
strictListInference = true

services:
  web:
    image: ghcr.io/{owner}/07-vps-sqlite-saas:latest
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - data:/data
      - media:/app/media
    healthcheck:
      # python+urllib instead of curl — the prod image only installs
      # litestream and slim has no curl.
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8000/healthz\",timeout=2).status==200 else 1)'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  worker:
    image: ghcr.io/{owner}/07-vps-sqlite-saas:latest
    restart: unless-stopped
    command: python manage.py db_worker
    env_file: .env.prod
    volumes:
      - data:/data
    # Wait for `web` (not a `db` service — there is none, SQLite lives on the
    # shared `data` volume) so litestream's restore + migrate has already run
    # before the worker opens the same DB file.
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - media:/srv/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web

volumes:
  data:
  media:
  caddy_data:
  caddy_config:

# The default json-file log driver grows without bound — cap it once here
# and attach to every service, or the VPS disk fills in a few months.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: ghcr.io/{owner}/07-vps-sqlite-saas:latest
    restart: unless-stopped
    volumes:
      - data:/data
      - media:/app/media
    env_file: .env.prod
    logging: *logging
    healthcheck:
      # python+urllib instead of curl — the prod image only installs
      # litestream and slim has no curl. DJANGO_ALLOWED_HOSTS must
      # include localhost (see deploy/.env.prod.example) or this probe 400s.
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8000/healthz\",timeout=2).status==200 else 1)'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  worker:
    image: ghcr.io/{owner}/07-vps-sqlite-saas:latest
    restart: unless-stopped
    volumes:
      - data:/data
      - media:/app/media
    env_file: .env.prod
    command: ["python", "manage.py", "db_worker"]
    logging: *logging
    depends_on:
      web:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - media:/srv/media:ro
    ports:
      - "80:80"
      - "443:443"
    logging: *logging
    depends_on:
      - web

volumes:
  data:
  media:
  caddy_data:
  caddy_config:

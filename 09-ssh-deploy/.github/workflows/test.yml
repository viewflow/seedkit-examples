name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # 50+ chars, 5+ unique, no "django-insecure-" prefix — Django's
      # security.W009 check flags that prefix regardless of length.
      DJANGO_SECRET_KEY: ci-placeholder-not-a-real-secret-key-0123456789abcdefghij
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_CSRF_TRUSTED_ORIGINS: https://example.com
      REDIS_URL: redis://localhost:6379
      AWS_ACCESS_KEY_ID: ci-placeholder
      AWS_SECRET_ACCESS_KEY: ci-placeholder
      DBBACKUP_BUCKET: ci-placeholder

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run ruff check .
      - run: uv run ruff format --check .

      # Catches security-setting regressions (SSL_REDIRECT without proxy,
      # missing HSTS, etc.) at CI time instead of first-deploy.
      - run: uv run manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production

      - run: uv run pytest

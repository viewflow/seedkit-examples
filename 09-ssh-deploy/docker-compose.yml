name: 09-ssh-deploy

services:
  db:
    image: postgres:17
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      # Host port 5435 (not 5432): this dev machine already runs a native
      # Postgres on 5432 outside Docker — remap to avoid a bind conflict.
      - "127.0.0.1:5435:5432"   # host Django reaches it via localhost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      # Host port 6381 (not 6379): this dev machine already runs a native
      # Redis on 6379 outside Docker — remap to avoid a bind conflict.
      - "127.0.0.1:6381:6379"   # host Django / workers reach it via localhost
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

name: 08-fly-app   # matches pyproject.toml [project].name; isolates volumes/networks per project

services:
  db:
    image: postgres:17
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:15432:5432"   # host Django reaches it via localhost (non-default: 5432 taken by a native postgres on this host)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:16379:6379"   # host Django / workers reach it via localhost (non-default: 6379 taken by a native redis on this host)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    volumes: ["miniodata:/data"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:19000:9000"   # S3 API — loopback only; production uses real S3 (non-default: 9000 taken by another project's container on this host)
      - "127.0.0.1:19001:9001"   # web console
    command: server /data --console-address ":9001"
    healthcheck:
      # `wget` isn't in minio/minio:latest — use curl, which is.
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  miniodata:
